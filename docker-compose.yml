# ─────────────────────────────────────────────────────────────
# 로컬 개발 인프라
#
#  redis : 운영 의존성. ORDER_ID/SHIPMENT_ID 원자 채번(INCR)과
#          배치 중복 실행 방지 분산 락에 실제로 사용된다.
#
#  ※ 로컬 DB 컨테이너는 두지 않는다 (설계 결정 D-08).
#     적재 대상이 Oracle 19c 로 확정됐고(BOOT-001 실측), MySQL 컨테이너는
#     충실한 테스트 대역이 아니다 — LIMIT vs FETCH FIRST, SYSDATE,
#     VARCHAR2 의 BYTE 길이 의미론이 전부 다르다.
#     로컬에서 통과한 SQL 이 원격에서 깨지는 대역은 안전망이 아니라 위험 요소다.
#     원격 DB 는 APPLICANT_KEY 로 지원자별 격리돼 있어 직접 사용해도 안전하다.
#     실제 스키마는 docs/interface-spec.md 와 sql/oracle-schema.reference.sql 참조.
#
# 포트는 로컬 기존 인스턴스와 충돌하지 않도록 비표준으로 매핑했다.
# ─────────────────────────────────────────────────────────────
services:
  redis:
    image: redis:7.4-alpine
    container_name: inspien-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
