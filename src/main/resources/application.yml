spring:
  application:
    name: inspien-eai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      # docker-compose.yml 에서 16379 로 매핑했다 (로컬 기존 Redis 와 충돌 회피).
      #   docker compose up -d
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      # 채번은 실시간 응답 경로 위에 있다. 무한 대기하면 Redis 장애가
      # 그대로 주문 API 응답 지연으로 전파된다. 짧게 끊고 재시도로 넘긴다.
      connect-timeout: 2s
      timeout: 2s

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.inspien.eai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{txId:-}] %logger{36} - %msg%n"

inspien:
  # 적재 대상 DB (Oracle 19c, 원격).
  # 접속정보(URL·계정·비밀번호)는 여기 없다 — BOOT-000 이 복호화해 secrets/ 에 놓은
  # 산출물에서 읽는다. 여기에 있는 것은 우리가 정하는 운영 파라미터뿐이다.
  jdbc:
    # 데이터 평면 스위치. 제어 평면(bootstrap/probe) 프로파일에서는 false 로 끈다 —
    # 접속정보를 '받아 오는' 단계에 커넥션 풀이 떠 있어야 할 이유가 없다.
    enabled: true

    # 타임아웃을 전부 명시한다 (정의서 5.2). JDBC 기본값은 대부분 무한 대기고,
    # 상대가 죽는 것보다 '응답하지 않는 것' 이 서비스를 멈추는 진짜 원인이다.
    connect-timeout: 10s      # oracle.net.CONNECT_TIMEOUT
    read-timeout: 20s         # oracle.jdbc.ReadTimeout
    query-timeout: 20s        # Statement.setQueryTimeout
    # Hikari connectionTimeout. 풀이 비면 이 대기에 드라이버 접속 시간이 포함되므로
    # connect-timeout 보다 길어야 한다. 짧으면 진짜 원인을 보기 전에 풀이 먼저 끊는다.
    pool-wait-timeout: 15s
    # 보상 트랜잭션 구조상 커넥션이 FTP 업로드 시간만큼 점유된다.
    # 1로 두면 배치와 실시간이 서로를 기다린다.
    maximum-pool-size: 5
    batch-size: 500

  # 영수증 파일 전송 대상 (평문 FTP, Pure-FTPd).
  # 접속정보는 secrets/ftp.conn.properties 에서 온다.
  ftp:
    enabled: true

    connect-timeout: 10s
    data-timeout: 15s

    # ★ 파일명과 내용은 서로 다른 채널로 나간다. 인코딩도 따로 정한다 (정의서 3.7).
    #   control-encoding : 제어 채널 = 파일명. commons-net 기본값은 ISO-8859-1 이라
    #                      그대로 두면 한글이 '?' 로 치환된 채 전송되고 예외도 안 난다.
    #                      서버가 FEAT 에서 UTF8 을 선언함(BOOT-001 실측).
    #   content-encoding : 파일 내용. 원본 XML 인코딩 계승 (D-07).
    #                      판단이 갈릴 수 있어 설정으로 분리해 둔다.
    control-encoding: UTF-8
    content-encoding: EUC-KR

    # 방화벽/NAT 환경에서 active 는 데이터 채널이 막힌다.
    passive-mode: true

    # ★ D-21: 임시 파일명(.tmp) 설정이 없다.
    #   초판은 .tmp 로 올린 뒤 rename 으로 확정했으나, 대상 서버가 rename 을 거부한다
    #   (451 Rename/move failure: Operation not permitted — 실측).
    #   Oracle 도 DELETE 권한이 없다(ORA-01031). 대상 환경 전체가 append-only 이므로,
    #   준비 단계에 원격에 무언가를 쓰면 되돌릴 방법이 없어진다.
    #   → 업로드를 확정(commit) 단계로 옮겼고, 임시 이름 개념 자체가 사라졌다.

    # 업로드 후 리스팅해 파일명과 크기가 보존됐는지 확인한다.
    # 끄지 말 것 — 인코딩 손상도 잘린 파일도 예외 없이 성공으로 보고된다.
    # 크기까지 보는 이유: 최종 파일명으로 바로 올리므로 전송이 끊기면
    # 잘린 파일이 최종 이름을 달고 남고, 이름만 보면 그것이 통과한다.
    verify-uploaded-name: true

  bootstrap:
    # 평상시 실행에는 관여하지 않는다. bootstrap 프로파일에서만 true 로 켜진다.
    enabled: false
    endpoint: https://inspien.it-cpi002-rt.cfapps.ap10.hana.ondemand.com/http/RecruitingTest
    # ⚠️ 실제 값은 여기에 쓰지 않는다. 환경변수 또는 application-local.yml 로 주입.
    username: ${INSPIEN_API_USERNAME:}
    password: ${INSPIEN_API_PASSWORD:}
    applicant:
      name: ${INSPIEN_APPLICANT_NAME:}
      phone-number: ${INSPIEN_APPLICANT_PHONE:}
      email: ${INSPIEN_APPLICANT_EMAIL:}
    output-dir: ./secrets
    connect-timeout: 10s
    read-timeout: 30s
