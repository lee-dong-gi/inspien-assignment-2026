spring:
  application:
    name: inspien-eai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      # docker-compose.yml 에서 16379 로 매핑했다 (로컬 기존 Redis 와 충돌 회피).
      #   docker compose up -d
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      # 채번은 실시간 응답 경로 위에 있다. 무한 대기하면 Redis 장애가
      # 그대로 주문 API 응답 지연으로 전파된다. 짧게 끊고 재시도로 넘긴다.
      connect-timeout: 2s
      timeout: 2s

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.inspien.eai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{txId:-}] %logger{36} - %msg%n"

inspien:
  bootstrap:
    # 평상시 실행에는 관여하지 않는다. bootstrap 프로파일에서만 true 로 켜진다.
    enabled: false
    endpoint: https://inspien.it-cpi002-rt.cfapps.ap10.hana.ondemand.com/http/RecruitingTest
    # ⚠️ 실제 값은 여기에 쓰지 않는다. 환경변수 또는 application-local.yml 로 주입.
    username: ${INSPIEN_API_USERNAME:}
    password: ${INSPIEN_API_PASSWORD:}
    applicant:
      name: ${INSPIEN_APPLICANT_NAME:}
      phone-number: ${INSPIEN_APPLICANT_PHONE:}
      email: ${INSPIEN_APPLICANT_EMAIL:}
    output-dir: ./secrets
    connect-timeout: 10s
    read-timeout: 30s
