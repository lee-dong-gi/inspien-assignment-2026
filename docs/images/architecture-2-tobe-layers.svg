<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<title>To-Be EAI 계층도</title>
<desc>송신 시스템, EAI 연계 엔진, 수신 시스템 3단 구조. 엔진 안에 Sender, Validator, Mapper, Coordinator, Receiver 다섯 구간이 세로로 놓이고 Sender 와 Receiver 가 교체 지점이다. 두 인터페이스가 색으로 구분되어 같은 엔진을 통과한다.</desc>
<style>
text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.ts{font-size:12px;fill:#5f5e5a}
.th{font-size:14px;font-weight:500;fill:#2c2c2a}
rect{stroke-width:.5}
.box{fill:#ffffff;stroke:#b4b2a9}
.gray rect{fill:#f1efe8;stroke:#5f5e5a}
.gray .ts,.gray .th{fill:#2c2c2a}
.purple rect{fill:#eeedfe;stroke:#534ab7}
.purple .ts,.purple .th{fill:#3c3489}
.teal rect{fill:#e1f5ee;stroke:#0f6e56}
.teal .ts,.teal .th{fill:#085041}
.zone{fill:none;stroke:#b4b2a9;stroke-dasharray:4 3}
path,line{fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="560" fill="#ffffff" stroke="none"/>

<rect class="zone" x="40" y="60" width="150" height="176" rx="12"/>
<text class="th" x="52" y="82">송신 시스템</text>
<g class="purple"><rect x="52" y="96" width="126" height="56" rx="8"/><text class="th" x="115" y="114" text-anchor="middle" dominant-baseline="central">주문자</text><text class="ts" x="115" y="132" text-anchor="middle" dominant-baseline="central">REST · EUC-KR</text></g>
<g class="teal"><rect x="52" y="164" width="126" height="56" rx="8"/><text class="th" x="115" y="182" text-anchor="middle" dominant-baseline="central">ORDER_TB</text><text class="ts" x="115" y="200" text-anchor="middle" dominant-baseline="central">status = N</text></g>

<g class="gray"><rect x="240" y="44" width="210" height="360" rx="16"/></g>
<text class="th" x="345" y="68" text-anchor="middle">INSPIEN EAI 엔진</text>
<rect class="box" x="252" y="82" width="186" height="56" rx="8"/>
<text class="th" x="345" y="100" text-anchor="middle" dominant-baseline="central">① Sender</text>
<text class="ts" x="345" y="120" text-anchor="middle" dominant-baseline="central">교체 지점</text>
<rect class="box" x="252" y="154" width="186" height="44" rx="8"/>
<text class="th" x="345" y="176" text-anchor="middle" dominant-baseline="central">② Validator</text>
<rect class="box" x="252" y="214" width="186" height="44" rx="8"/>
<text class="th" x="345" y="236" text-anchor="middle" dominant-baseline="central">③ Mapper</text>
<rect class="box" x="252" y="274" width="186" height="44" rx="8"/>
<text class="th" x="345" y="296" text-anchor="middle" dominant-baseline="central">④ Coordinator</text>
<rect class="box" x="252" y="334" width="186" height="56" rx="8"/>
<text class="th" x="345" y="352" text-anchor="middle" dominant-baseline="central">⑤ Receiver</text>
<text class="ts" x="345" y="372" text-anchor="middle" dominant-baseline="central">교체 지점</text>
<line x1="345" y1="138" x2="345" y2="150" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="345" y1="198" x2="345" y2="210" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="345" y1="258" x2="345" y2="270" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="345" y1="318" x2="345" y2="330" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="zone" x="500" y="196" width="140" height="208" rx="12"/>
<text class="th" x="512" y="218">수신 시스템</text>
<g class="purple"><rect x="512" y="232" width="116" height="44" rx="8"/><text class="ts" x="570" y="254" text-anchor="middle" dominant-baseline="central">ORDER_TB</text></g>
<g class="purple"><rect x="512" y="288" width="116" height="44" rx="8"/><text class="ts" x="570" y="310" text-anchor="middle" dominant-baseline="central">FTP 영수증</text></g>
<g class="teal"><rect x="512" y="344" width="116" height="44" rx="8"/><text class="ts" x="570" y="366" text-anchor="middle" dominant-baseline="central">SHIPMENT_TB</text></g>

<path d="M178 124C206 124 212 100 246 100" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M178 192C212 192 210 122 246 120" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<path d="M444 350C470 350 474 254 506 254" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M444 358C468 358 478 310 506 310" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M444 366C472 366 480 366 506 366" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<rect x="40" y="256" width="150" height="88" rx="8" fill="none" stroke="#d3d1c7" stroke-width="0.5"/>
<text class="ts" x="52" y="278">인터페이스</text>
<line x1="54" y1="300" x2="76" y2="300" stroke="#7F77DD" stroke-width="1.5"/>
<text class="ts" x="84" y="304">IF-ORD-001 sync</text>
<line x1="54" y1="326" x2="76" y2="326" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3"/>
<text class="ts" x="84" y="330">IF-SHP-001 5분</text>

<line x1="345" y1="404" x2="345" y2="428" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect class="zone" x="40" y="428" width="600" height="96" rx="12"/>
<text class="th" x="52" y="450">횡단 관심사 — 전 구간 공통</text>
<rect class="box" x="52" y="464" width="280" height="44" rx="8"/>
<text class="ts" x="192" y="486" text-anchor="middle" dominant-baseline="central">InterfaceLogger · txId · 구간 · 결과 · 건수</text>
<rect class="box" x="348" y="464" width="280" height="44" rx="8"/>
<text class="ts" x="488" y="486" text-anchor="middle" dominant-baseline="central">EaiErrorCode · retryable / non-retryable</text>
</svg>
