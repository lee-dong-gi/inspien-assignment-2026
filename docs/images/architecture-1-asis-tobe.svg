<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>As-Is 에서 To-Be 로의 변화</title>
<desc>As-Is 에서는 주문자가 회계 담당자와 쇼핑몰 DB 를 직접 알아야 하고, 쇼핑몰이 운송회사로 다시 보낸다. To-Be 에서는 가운데 INSPIEN EAI 엔진이 들어와 주문자 요청을 받아 세 시스템으로 연계하며, 세 시스템은 그대로 남아 있다.</desc>
<style>
text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.ts{font-size:12px;fill:#5f5e5a}
.tx{font-size:11px;fill:#8a887f}
.th{font-size:14px;font-weight:500;fill:#2c2c2a}
rect{stroke-width:.5}
.gray rect{fill:#f1efe8;stroke:#5f5e5a}
.gray .ts,.gray .th{fill:#2c2c2a}
.purple rect{fill:#eeedfe;stroke:#534ab7}
.purple .ts,.purple .th{fill:#3c3489}
.teal rect{fill:#e1f5ee;stroke:#0f6e56}
.teal .ts,.teal .th{fill:#085041}
path,line{fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="520" fill="#ffffff" stroke="none"/>

<text class="th" x="40" y="52">As-Is — 시스템끼리 직접 이어져 있다</text>
<text class="tx" x="40" y="74">주문자가 회계 FTP 주소도, 쇼핑몰 DB 접속정보도 알아야 한다</text>

<g class="gray"><rect x="486" y="100" width="154" height="44" rx="8"/><text class="ts" x="563" y="122" text-anchor="middle" dominant-baseline="central">회계 영수증 관리자</text></g>
<g class="gray"><rect x="40" y="144" width="120" height="48" rx="8"/><text class="ts" x="100" y="160" text-anchor="middle" dominant-baseline="central">주문자</text><text class="tx" x="100" y="178" text-anchor="middle" dominant-baseline="central">REST</text></g>
<g class="gray"><rect x="270" y="144" width="150" height="48" rx="8"/><text class="ts" x="345" y="160" text-anchor="middle" dominant-baseline="central">온라인 쇼핑몰</text><text class="tx" x="345" y="178" text-anchor="middle" dominant-baseline="central">주문 DB</text></g>
<g class="gray"><rect x="486" y="194" width="154" height="44" rx="8"/><text class="ts" x="563" y="216" text-anchor="middle" dominant-baseline="central">운송회사 DB</text></g>

<path d="M160 158C205 158 205 122 480 122" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M160 178L264 178" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M420 180C452 180 454 216 480 216" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<line x1="24" y1="256" x2="656" y2="256" stroke="#d3d1c7" stroke-width="0.5"/>

<text class="th" x="40" y="290">To-Be — 가운데가 번역한다</text>
<text class="tx" x="40" y="312">주문자는 엔진만 안다. 세 시스템은 그대로 남는다</text>

<g class="purple"><rect x="40" y="350" width="120" height="44" rx="8"/><text class="ts" x="100" y="372" text-anchor="middle" dominant-baseline="central">주문자</text></g>
<g class="gray"><rect x="220" y="322" width="170" height="100" rx="12"/><text class="th" x="305" y="360" text-anchor="middle" dominant-baseline="central">INSPIEN EAI 엔진</text><text class="ts" x="305" y="384" text-anchor="middle" dominant-baseline="central">① ~ ⑤ 파이프라인</text></g>
<g class="gray"><rect x="486" y="302" width="154" height="56" rx="8"/><text class="ts" x="563" y="320" text-anchor="middle" dominant-baseline="central">ORDER_TB</text><text class="tx" x="563" y="340" text-anchor="middle" dominant-baseline="central">두 인터페이스가 공유</text></g>
<g class="purple"><rect x="486" y="370" width="154" height="44" rx="8"/><text class="ts" x="563" y="392" text-anchor="middle" dominant-baseline="central">회계 영수증 관리자 · FTP</text></g>
<g class="teal"><rect x="486" y="426" width="154" height="44" rx="8"/><text class="ts" x="563" y="448" text-anchor="middle" dominant-baseline="central">SHIPMENT_TB</text></g>

<path d="M160 372L214 372" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390 336C420 336 442 324 480 324" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 346C442 346 420 356 394 358" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<path d="M390 380C420 380 445 392 480 392" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390 406C425 406 445 448 480 448" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<line x1="40" y1="496" x2="62" y2="496" stroke="#7F77DD" stroke-width="1.5"/>
<text class="ts" x="70" y="500">시나리오 1 — IF-ORD-001 sync</text>
<line x1="286" y1="496" x2="308" y2="496" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3"/>
<text class="ts" x="316" y="500">시나리오 2 — IF-SHP-001 async 5분</text>
</svg>
